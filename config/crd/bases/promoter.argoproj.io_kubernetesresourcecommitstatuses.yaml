---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: kubernetesresourcecommitstatuses.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: KubernetesResourceCommitStatus
    listKind: KubernetesResourceCommitStatusList
    plural: kubernetesresourcecommitstatuses
    singular: kubernetesresourcecommitstatus
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.key
      name: Key
      type: string
    - jsonPath: .spec.promotionStrategyRef.name
      name: PromotionStrategy
      type: string
    - jsonPath: .spec.templateRef.kind
      name: Template
      type: string
    - jsonPath: .spec.reportOn
      name: ReportOn
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubernetesResourceCommitStatus is the Schema for the kubernetesresourcecommitstatuses API.

          It gates promotions on a Kubernetes resource the controller creates from a wrapped template, for example a
          batch/v1 Job that runs a smoke test, and reports the phase computed from that resource's live status.
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#kubernetesresourcecommitstatus
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KubernetesResourceCommitStatus
            properties:
              descriptionTemplate:
                description: |-
                  DescriptionTemplate is the human-readable commit status description in the SCM provider.
                  Go template with the same variables and Sprig rules as spec.templateRef, plus:
                    - {{ .Phase }}: the phase computed this reconcile
                    - {{ .Resource }}: the live resource (nil when it does not exist); for example {{ .Resource.status.succeeded }}
                  Defaults to "<Kind> <name> is <phase>" when empty.
                type: string
              historyLimit:
                default: 0
                description: |-
                  HistoryLimit is how many resources created for superseded SHAs are kept per environment, newest first. The
                  resource for the current reported SHA is always kept. 0 (the default) deletes a superseded resource as soon
                  as the reported SHA changes.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              key:
                description: |-
                  Key is the unique identifier for this gate. It is used as the commit status key and must match a key in
                  the PromotionStrategy's proposedCommitStatuses or activeCommitStatuses.
                  Must be lowercase alphanumeric with hyphens, 1–63 characters (pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$).
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              phase:
                description: Phase maps the live resource to the commit status phase.
                  See KubernetesResourcePhaseSpec.
                properties:
                  expression:
                    description: |-
                      Expression is an expr expression (github.com/expr-lang/expr) evaluated on every reconcile against the
                      live resource created from the template. It decides the phase reported on the CommitStatus.

                      Accepted return values:
                        - a boolean: true is "success", false is "pending"
                        - a string: "success", "pending", or "failure"
                        - an object { phase }: phase is one of the strings above; an omitted or empty phase means "pending"

                      Available variables:
                        - Resource (object): the live resource as returned by the API server (metadata, spec, status, ...).
                          The expression only runs when the resource exists (it is created first), so Resource is never nil here;
                          guarding against nil is still good practice because optional fields such as status may be missing.
                        - Branch (string): the environment branch being evaluated
                        - Sha (string): the hydrated SHA the resource was created for (see spec.reportOn)
                        - Phase (string): the phase reported for this environment by the previous reconcile ("" on the first)
                        - Environment (object): the PromotionStrategy status entry for Branch
                        - PromotionStrategy (object): the full PromotionStrategy spec and status
                        - KubernetesResourceCommitStatus (object): this resource's spec and status (snapshot from the previous reconcile)

                      Use optional chaining and the nil-coalescing operator for fields that may not exist yet.

                      Examples:
                        # batch/v1 Job: succeed once a pod completed, fail once the backoff limit is exhausted
                        - "Resource == nil ? 'pending' : (Resource.status?.succeeded ?? 0) > 0 ? 'success' : (Resource.status?.failed ?? 0) > 0 ? 'failure' : 'pending'"

                        # Argo Workflow
                        - "Resource?.status?.phase == 'Succeeded' ? 'success' : Resource?.status?.phase in ['Failed', 'Error'] ? 'failure' : 'pending'"

                        # Any resource with a Ready condition
                        - "any(Resource?.status?.conditions ?? [], {.type == 'Ready' && .status == 'True'})"
                    minLength: 1
                    type: string
                required:
                - expression
                type: object
              pollInterval:
                default: 30s
                description: |-
                  PollInterval is how often the live resource is re-read while any environment is pending. Resource status
                  changes are observed by polling, not by a watch, so a phase change is reported at most one interval late.
                  Once every environment is success or failure, the controller falls back to the controller's configured
                  requeue duration; a new SHA on the PromotionStrategy triggers a reconcile immediately.
                type: string
              promotionStrategyRef:
                description: |-
                  PromotionStrategyRef references the PromotionStrategy this applies to.
                  The controller creates resources and CommitStatuses for every environment where this
                  KubernetesResourceCommitStatus.Spec.Key matches an entry in either:
                    - PromotionStrategy.Spec.ProposedCommitStatuses / ActiveCommitStatuses (applies to all environments), OR
                    - Environment.ProposedCommitStatuses / ActiveCommitStatuses (applies to a specific environment)
                  Which list is checked depends on spec.reportOn.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              publishTo:
                default:
                - scm
                description: |-
                  PublishTo is copied to spec.publishTo on each CommitStatus this controller creates.
                  - "scm": the CommitStatus controller posts them to the SCM provider
                  The default is ["scm"]. An empty list keeps them in Kubernetes and does not post them to the SCM.
                  Omitting the field uses the default. Promotion gates use the phase in every case.
                items:
                  description: CommitStatusPublishTo is one destination a commit status
                    can be published to.
                  enum:
                  - scm
                  type: string
                type: array
                x-kubernetes-list-type: set
              reportOn:
                default: proposed
                description: |-
                  ReportOn specifies which commit SHA the resource is created for and the CommitStatus is reported on.
                  - "proposed": the proposed hydrated commit SHA (default). Use it for checks that must pass before a change
                    is promoted, for example a smoke-test Job against a preview of the proposed change.
                  - "active": the active hydrated commit SHA. Use it for checks that run against what is deployed, for
                    example an integration-test Job that must pass before the next environment may promote.

                  A new resource is created whenever the reported SHA changes; the resources of superseded SHAs are deleted
                  subject to spec.historyLimit. While an environment is pending or failed, a resource that disappears is
                  created again on the next reconcile (delete a failed Job to re-run it). Once an environment reported
                  success for a SHA, a missing resource (for example a Job removed by ttlSecondsAfterFinished) keeps the
                  last report and is not recreated, so a gate that was open stays open.
                enum:
                - proposed
                - active
                type: string
              templateRef:
                description: |-
                  TemplateRef names the wrapped template resource whose spec.template is rendered and created. See
                  ResourceTemplateReference.

                  Every string value in the template is rendered as a Go template with Sprig functions (except env,
                  expandenv, and getHostByName; urlQueryEscape is also available). Template variables:
                    - {{ .Branch }}: the environment branch
                    - {{ .Sha }}: the hydrated SHA the resource is created for; {{ .ShortSha }}: its first 7 characters
                    - {{ .Key }}: spec.key; {{ .ReportOn }}: spec.reportOn
                    - {{ .ResourceName }}: the name the controller assigns to the created resource
                    - {{ .Namespace }}: the namespace the resource is created in (the KubernetesResourceCommitStatus namespace)
                    - {{ .Environment }}: the PromotionStrategy status entry for the branch (for example .Environment.Proposed.Dry.Sha)
                    - {{ .PromotionStrategy }}: the full PromotionStrategy
                    - {{ .KubernetesResourceCommitStatus }}: this resource

                  metadata.name, metadata.namespace, and metadata.ownerReferences in the template are replaced by the
                  controller: the resource is named deterministically from the gate name, branch, and SHA, created in the
                  KubernetesResourceCommitStatus namespace, and owned by the KubernetesResourceCommitStatus so it is garbage
                  collected with it. Template labels and annotations are kept; the controller adds its own labels
                  (promoter.argoproj.io/commit-status, promoter.argoproj.io/environment, promoter.argoproj.io/reported-sha,
                  and the parent gate label).
                properties:
                  kind:
                    description: Kind is the generated template kind in the templates.promoter.argoproj.io
                      group, for example JobTemplate.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                  name:
                    description: Name is the name of the template resource in the
                      same namespace as the KubernetesResourceCommitStatus.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - kind
                - name
                type: object
              urlTemplate:
                description: |-
                  UrlTemplate is the commit status target URL in the SCM provider, rendered with the same variables as
                  DescriptionTemplate. Typical use: a link to the resource in a dashboard. Empty means no URL.
                type: string
            required:
            - key
            - phase
            - promotionStrategyRef
            - templateRef
            type: object
          status:
            description: status defines the observed state of KubernetesResourceCommitStatus
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environments:
                description: Environments holds the observed state of each applicable
                  environment.
                items:
                  description: KubernetesResourceCommitStatusEnvironmentStatus is
                    the observed state for one environment.
                  properties:
                    branch:
                      description: Branch is the environment branch name.
                      minLength: 1
                      type: string
                    description:
                      description: Description mirrors child CommitStatus.spec.description.
                      type: string
                    lastEvaluationTime:
                      description: LastEvaluationTime is when spec.phase.expression
                        was last evaluated for this environment.
                      format: date-time
                      type: string
                    phase:
                      description: Phase mirrors child CommitStatus.spec.phase.
                      enum:
                      - pending
                      - success
                      - failure
                      - ""
                      type: string
                    reportedSha:
                      description: |-
                        ReportedSha is the hydrated SHA the child CommitStatus is attached to (CommitStatus.spec.sha).
                        Semantics depend on the parent gate (proposed vs active hydrated SHA).
                        Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    resource:
                      description: Resource identifies the resource created from the
                        template for reportedSha.
                      properties:
                        apiVersion:
                          description: APIVersion of the created resource, for example
                            batch/v1.
                          minLength: 1
                          type: string
                        kind:
                          description: Kind of the created resource, for example Job.
                          minLength: 1
                          type: string
                        name:
                          description: Name of the created resource.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace of the created resource (always the
                            KubernetesResourceCommitStatus namespace).
                          minLength: 1
                          type: string
                      required:
                      - apiVersion
                      - kind
                      - name
                      - namespace
                      type: object
                    resourceExists:
                      description: |-
                        ResourceExists reports whether the resource was found on the last reconcile. False means the resource of
                        a succeeded SHA was deleted (for example by ttlSecondsAfterFinished); its last report is kept and it is
                        not recreated. Pending and failed resources are recreated on the next reconcile, so they read true again.
                      type: boolean
                    url:
                      description: Url mirrors child CommitStatus.spec.url.
                      pattern: ^(https?://.*)?$
                      type: string
                      x-kubernetes-validations:
                      - message: must be a valid URL
                        rule: self == '' || isURL(self)
                  required:
                  - branch
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
