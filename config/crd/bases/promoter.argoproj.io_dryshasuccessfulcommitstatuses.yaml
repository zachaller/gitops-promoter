---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dryshasuccessfulcommitstatuses.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: DryShaSuccessfulCommitStatus
    listKind: DryShaSuccessfulCommitStatusList
    plural: dryshasuccessfulcommitstatuses
    singular: dryshasuccessfulcommitstatus
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.promotionStrategyRef.name
      name: PromotionStrategy
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DryShaSuccessfulCommitStatus is the Schema for the dryshasuccessfulcommitstatuses
          API
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#dryshasuccessfulcommitstatus
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DryShaSuccessfulCommitStatus
            properties:
              allowNewerDrySha:
                default: true
                description: |-
                  AllowNewerDrySha lets an upstream environment satisfy the gate when it is successful on a dry
                  commit that descends from the target dry commit, rather than requiring the target itself to have
                  been successful. Because the record is rebuilt from a first-parent walk of the upstream's active
                  branch, a later entry is strictly a later promotion on that branch, so the upstream demonstrably
                  deployed the target's content and has since become healthy past it.

                  Set to false for exact-SHA-only semantics: the target dry commit itself must have been successful.
                type: boolean
              historyDepth:
                default: 20
                description: |-
                  HistoryDepth is how many first-parent commits of each environment's active branch are walked when
                  rebuilding the dry SHA record from the promotion-history git notes. A dry commit older than this
                  depth is not found in the record and the gate reports pending for it.
                format: int32
                maximum: 200
                minimum: 1
                type: integer
              key:
                description: |-
                  Key is the commit status key this controller writes on each environment's proposed hydrated SHA.
                  The PromotionStrategy controller injects this key onto every ChangeTransferPolicy's proposedCommitStatuses.
                  Must be lowercase alphanumeric with hyphens, 1–63 characters (pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$).
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              promotionStrategyRef:
                description: |-
                  PromotionStrategyRef is a reference to the promotion strategy that this gate applies to. The controller
                  watches this PromotionStrategy and, for each environment, reports whether the dry commit being promoted
                  has already been successful in that environment's upstream (dependsOn) environments.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              url:
                description: |-
                  URL generates the URL to use on the per-environment CommitStatus (SCM details link), for
                  example a link into the Promoter UI that highlights this environment's dependsOn upstreams.
                  Optional; when empty, no URL is set on the child CommitStatus. The template receives
                  .Environment, .DryShaSuccessfulCommitStatus, .PromotionStrategy, .DependsOn, and .DependsOnQuery
                  (see controller docs).
                properties:
                  options:
                    description: "Options sets options for the template. Options are
                      described by\nstrings, either a simple string or \"key=value\".
                      There can be at\nmost one equals sign in an option string. If
                      the option string\nis unrecognized or otherwise invalid, Option
                      panics.\n\nKnown options:\n\nmissingkey: Control the behavior
                      during execution if a map is\nindexed with a key that is not
                      present in the map.\n\n\t\"missingkey=default\" or \"missingkey=invalid\"\n\t\tThe
                      default behavior: Do nothing and continue execution.\n\t\tIf
                      printed, the result of the index operation is the string\n\t\t\"<no
                      value>\".\n\t\"missingkey=zero\"\n\t\tThe operation returns
                      the zero value for the map type's element.\n\t\"missingkey=error\"\n\t\tExecution
                      stops immediately with an error."
                    items:
                      type: string
                    type: array
                  template:
                    description: |-
                      Template is a Go text template used to generate the CommitStatus URL. A function called
                      urlQueryEscape is available to escape URL query parameters. The template can be configured
                      with options (url.options) to control behavior when a variable is not present.

                      Available template variables depend on the parent resource that embeds URLConfig
                      (ArgoCDCommitStatus or DependentsSuccessfulCommitStatus). See the
                      corresponding gate documentation for the variable set and examples.
                    type: string
                type: object
            required:
            - key
            - promotionStrategyRef
            type: object
          status:
            description: status defines the observed state of DryShaSuccessfulCommitStatus
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environments:
                description: Environments reports observed gate state and the cached
                  dry SHA record per dependency-graph branch.
                items:
                  description: DryShaSuccessfulCommitStatusEnvironmentStatus defines
                    observed state for one environment branch.
                  properties:
                    branch:
                      description: Branch is the environment branch name.
                      minLength: 1
                      type: string
                    description:
                      description: Description mirrors child CommitStatus.spec.description.
                      type: string
                    dryShaHistory:
                      description: |-
                        DryShaHistory is a cache of the dry commits this environment has run, newest first: index 0 is
                        closest to the active branch tip. It is rebuilt from the promotion-history git notes on the active
                        branch and is safe to delete — the next reconcile regenerates it from git.
                      items:
                        description: DryShaRecord is one entry of an environment's
                          dry SHA record, reconstructed from its active branch.
                        properties:
                          mergeSha:
                            description: |-
                              MergeSha is the active branch commit this entry was derived from. Entries are ordered by
                              first-parent distance from the branch tip, so it doubles as the entry's position marker.
                              For a live entry it is the environment's active hydrated SHA.
                            maxLength: 64
                            pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                            type: string
                          mergedAt:
                            description: |-
                              MergedAt is the merge time of the promotion that produced this entry (the note's
                              Pull-request-merge-time trailer). Informational; ordering uses the first-parent walk, not time.
                            format: date-time
                            type: string
                          sha:
                            description: |-
                              Sha is the dry commit that was running in the environment. For a git-derived entry this is the
                              promotion-history note's Sha-dry-active trailer, which records what the environment was running
                              immediately before that promotion merged.
                              Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                            maxLength: 64
                            pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                            type: string
                          source:
                            description: Source names which git source supplied this
                              entry's data.
                            enum:
                            - note
                            - commit-message
                            - live
                            type: string
                          successful:
                            description: |-
                              Successful is true when every active commit status recorded alongside Sha was successful. This is
                              the same success criterion DependentsSuccessfulCommitStatus applies to an upstream environment,
                              read from the recorded snapshot rather than from live state.
                            type: boolean
                        required:
                        - mergeSha
                        - sha
                        - successful
                        type: object
                      maxItems: 201
                      type: array
                      x-kubernetes-list-type: atomic
                    phase:
                      description: Phase mirrors child CommitStatus.spec.phase.
                      enum:
                      - pending
                      - success
                      - failure
                      - ""
                      type: string
                    rebuiltAt:
                      description: RebuiltAt is when the active branch walk that produced
                        dryShaHistory last ran.
                      format: date-time
                      type: string
                    rebuiltFromSha:
                      description: |-
                        RebuiltFromSha is the active branch tip that dryShaHistory was walked from. While the environment's
                        live active hydrated SHA still equals this, the cached record is current and no git work is done.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    reportedSha:
                      description: |-
                        ReportedSha is the hydrated SHA the child CommitStatus is attached to (CommitStatus.spec.sha).
                        Semantics depend on the parent gate (proposed vs active hydrated SHA).
                        Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    upstreams:
                      description: |-
                        Upstreams lists all transitive ancestor branches and whether each is satisfied for this
                        environment's promotion target.
                      items:
                        description: |-
                          DryShaSuccessfulCommitStatusUpstreamStatus reports whether a transitive upstream branch is satisfied
                          for this environment's promotion target.
                        properties:
                          branch:
                            description: Branch is the upstream environment branch
                              name.
                            minLength: 1
                            type: string
                          reason:
                            description: Reason explains why the upstream is not satisfied.
                              Omitted when satisfied is true.
                            type: string
                          satisfied:
                            description: Satisfied is true when the upstream has been
                              successful for this environment's target dry SHA.
                            type: boolean
                          satisfiedBySha:
                            description: |-
                              SatisfiedBySha is the dry commit whose recorded success satisfied this upstream. It equals the
                              target dry SHA for an exact match, or a descendant dry SHA when spec.allowNewerDrySha applies.
                              Omitted when the upstream is not satisfied.
                            maxLength: 64
                            pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                            type: string
                        required:
                        - branch
                        - satisfied
                        type: object
                      maxItems: 500
                      type: array
                      x-kubernetes-list-type: atomic
                    url:
                      description: Url mirrors child CommitStatus.spec.url.
                      pattern: ^(https?://.*)?$
                      type: string
                      x-kubernetes-validations:
                      - message: must be a valid URL
                        rule: self == '' || isURL(self)
                  required:
                  - branch
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
