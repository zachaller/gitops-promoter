apiVersion: promoter.argoproj.io/v1alpha1
kind: ChangeTransferPolicy
metadata:
  name: environment
spec:
  gitRepositoryRef:
    name: example-git-repository
  proposedBranch: environment/dev-next
  activeBranch: environment/dev
  # Copied from the owning PromotionStrategy. Empty means Latest.
  promotionPolicy: LatestVerified # Latest, LatestVerified, or Sequential
  # A promoter-owned branch carrying the candidate this policy selected. Required by every policy
  # other than Latest, which promotes the proposed branch tip directly. Nothing but the controller may
  # write to it; it is force-pushed whenever the selection changes.
  promotionBranch: environment/dev-promote
  candidates:
    # The changes every preceding environment has verified, newest first, computed by the
    # PromotionStrategy controller. Only these may be promoted. Omitted entirely for the first
    # environment in a sequence, which has nothing upstream to wait for.
    dryShas:
    - "abcdef1234567890abcdef1234567890abcdef12"
  # Defaults to true when omitted
  autoMerge: true
  activeCommitStatuses:
  - key: argocd-app-health
  proposedCommitStatuses:
  - key: security-scan
  - key: promoter-previous-environment
  pullRequest:
    labels:
      expression: "all(Status.Proposed.CommitStatuses, {.Phase == 'success'}) ? ['lgtm'] : []"
status:
  observedGeneration: 123 # compare with metadata.generation to detect stale status
  conditions:
    # The Ready condition indicates that the resource has been successfully reconciled, when there is an error during
    # reconciliation, the condition will be False with a reason of ReconciliationError. When we successfully reconcile the resource,
    # the condition will be True with a reason of ReconciliationSuccess. The Ready condition is essentially a way to show reconciliation
    # errors to the user. This condition exists on all resources that have reconciliation logic.
    - type: Ready
      lastTransitionTime: 2023-10-01T00:00:00Z
      message: Reconciliation succeeded
      reason: ReconciliationSuccess # ReconciliationSuccess ReconciliationError, or PullRequestNotReady
      status: "True" # "True," "False," or "Unknown"
      observedGeneration: 123

  proposed:
    dry:
      author: "Author Name <author@example.com>"
      body: "Body of the commit message (i.e. excluding the subject line)"
      commitTime: 2023-10-01T00:00:00Z
      repoURL: "https://git.example.com/org/repo.git"
      sha: "abcdef1234567890abcdef1234567890abcdef12"
      subject: "chore: Example commit subject line"
    hydrated:
    # The hydrated field contains the same fields as proposed.dry.
    note:
      # Only drySha is populated from the hydrator git note
      drySha: "abcdef1234567890abcdef1234567890abcdef12"
    commitStatuses:
      - key: example-key
        phase: pending # pending, success, or failure
        url: https://example.com/checks/example-key
        description: Waiting for check
  verification:
    # The changes this environment was healthy on at the point it promoted past them. Later
    # environments consult it (via the owning PromotionStrategy, which surfaces it as
    # status.environments[].verification) so a change stays promotable after this environment
    # has moved on to a newer one.
    #
    # This is a cache over git, not an accumulated log: each promotion records the outgoing change's
    # health in its merge commit on the active branch, so the record is rebuilt by walking that branch
    # when this status is lost. It excludes the change running right now, which has no merge commit
    # yet and is judged on live active commit statuses instead.
    dryShas:
    # Newest first, at most 50 entries.
    - sha: "abcdef1234567890abcdef1234567890abcdef12"
      time: 2023-10-01T00:00:00Z
    # The active branch commit the entries were built from. While the branch still points here the
    # walk is skipped; when it moves, only the commits added since are examined.
    observedActiveSha: "fedcba0987654321fedcba0987654321fedcba09"
  candidate:
    # The tip of the hydrator's proposed branch: the newest change that exists, whether or not it is
    # eligible for promotion. Only populated when promotionPolicy selects candidates, because
    # otherwise it is identical to proposed.
    drySha: "1111111111111111111111111111111111111111"
    hydratedSha: "2222222222222222222222222222222222222222"
    commitTime: 2023-10-01T00:00:00Z
    # Runs ahead of drySha after a hydration that changed no manifests.
    noteDrySha: "1111111111111111111111111111111111111111"
  active:
    dry:
      sha: "fedcba0987654321fedcba0987654321fedcba09"
      commitTime: 2023-09-15T00:00:00Z
      repoURL: "https://git.example.com/org/repo.git"
      subject: "chore: Currently deployed commit"
    hydrated:
    # same structure as proposed.dry
    commitStatuses:
      - key: argocd-app-health
        phase: success
  pullRequest:
    id: "848"
    state: open # open, closed, or merged; empty when externallyMergedOrClosed is true
    url: https://github.com/org/repo/pull/848
    prCreationTime: 2023-10-01T00:00:00Z
    # prMergeTime: set when merged
    # externallyMergedOrClosed: true  # PR closed/merged outside the controller
  history:
    # Recent promotions merged by the controller (newest first, at most 5 entries).
    - active:
        dry:
          sha: "fedcba0987654321fedcba0987654321fedcba09"
      proposed:
        hydrated:
          sha: "abcdef1234567890abcdef1234567890abcdef12"
        commitStatuses:
          - key: example-key
            phase: success
      pullRequest:
        id: "847"
        state: merged
        prCreationTime: 2023-09-01T00:00:00Z
        prMergeTime: 2023-09-01T01:00:00Z
        url: https://github.com/org/repo/pull/847
